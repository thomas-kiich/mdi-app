name: CI - Tests & Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Run linting
      run: pnpm run format --check
      continue-on-error: true
    
    - name: Run tests
      run: pnpm test
      continue-on-error: true
    
    - name: Build project
      run: pnpm build
      continue-on-error: true

  skills-validation:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate Skills Structure
      run: |
        echo "🔍 Validiere Skills Struktur..."
        
        # Überprüfe ob skills Ordner existiert
        if [ ! -d "skills" ]; then
          echo "❌ Skills Ordner nicht gefunden"
          exit 1
        fi
        
        # Überprüfe ob SKILL.md Dateien existieren
        SKILL_COUNT=$(find skills -name "SKILL.md" | wc -l)
        echo "✅ Gefunden: $SKILL_COUNT Skills mit SKILL.md"
        
        if [ $SKILL_COUNT -eq 0 ]; then
          echo "⚠️  Warnung: Keine SKILL.md Dateien gefunden"
        fi
        
        # Überprüfe ob Skills Verzeichnisse existieren
        SKILL_DIRS=$(find skills -maxdepth 1 -type d | tail -n +2 | wc -l)
        echo "✅ Gefunden: $SKILL_DIRS Skill-Verzeichnisse"
        
        # Überprüfe auf doppelte Skills
        DUPLICATES=$(find skills -maxdepth 1 -type d | tail -n +2 | sort | uniq -d | wc -l)
        if [ $DUPLICATES -gt 0 ]; then
          echo "❌ Fehler: Doppelte Skills gefunden!"
          exit 1
        fi
        
        echo "✅ Skills Validierung erfolgreich!"
    
    - name: Check for required files
      run: |
        echo "🔍 Überprüfe erforderliche Dateien..."
        
        # Überprüfe auf wichtige Dateien
        REQUIRED_FILES=(
          "package.json"
          "pnpm-lock.yaml"
          "drizzle/schema.ts"
          "server/routers.ts"
          "client/src/App.tsx"
        )
        
        for file in "${REQUIRED_FILES[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ Erforderliche Datei nicht gefunden: $file"
            exit 1
          fi
          echo "✅ $file"
        done
        
        echo "✅ Alle erforderlichen Dateien vorhanden!"

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check for security issues
      run: |
        echo "🔍 Überprüfe auf Sicherheitsprobleme..."
        
        # Überprüfe auf hardcodierte Secrets
        if grep -r "GITHUB_TOKEN\|API_KEY\|SECRET" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" server/ client/ 2>/dev/null | grep -v "process.env\|import\|export"; then
          echo "⚠️  Warnung: Mögliche hardcodierte Secrets gefunden"
        else
          echo "✅ Keine hardcodierten Secrets gefunden"
        fi
        
        # Überprüfe auf TODO/FIXME Kommentare
        TODO_COUNT=$(grep -r "TODO\|FIXME" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" server/ client/ 2>/dev/null | wc -l)
        if [ $TODO_COUNT -gt 0 ]; then
          echo "ℹ️  Info: $TODO_COUNT TODO/FIXME Kommentare gefunden"
        fi
        
        echo "✅ Code Quality Check abgeschlossen!"

  summary:
    runs-on: ubuntu-latest
    needs: [test, skills-validation, code-quality]
    if: always()
    
    steps:
    - name: Check job status
      run: |
        echo "📊 CI Pipeline Zusammenfassung"
        echo "================================"
        echo "✅ Tests: ${{ needs.test.result }}"
        echo "✅ Skills Validierung: ${{ needs.skills-validation.result }}"
        echo "✅ Code Quality: ${{ needs.code-quality.result }}"
        echo "================================"
        
        if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.skills-validation.result }}" = "failure" ] || [ "${{ needs.code-quality.result }}" = "failure" ]; then
          echo "❌ Pipeline fehlgeschlagen"
          exit 1
        fi
        
        echo "✅ Alle Checks erfolgreich!"
