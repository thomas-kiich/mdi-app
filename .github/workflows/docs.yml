name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'skills/**'
      - 'README.md'
      - 'GITHUB_SYNC_SETUP.md'
      - 'SKILLS_SYNC_SETUP.md'
      - 'AUTO_GITHUB_PUSH.md'

jobs:
  update-docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Generate Skills Documentation
      run: |
        echo "📚 Generiere Skills Dokumentation..."
        
        # Erstelle Skills Übersicht
        cat > SKILLS_OVERVIEW.md << 'EOF'
        # KIICH Skills Übersicht
        
        Automatisch generiert: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
        
        ## Verfügbare Skills
        
        EOF
        
        # Zähle Skills
        SKILL_COUNT=$(find skills -maxdepth 1 -type d | tail -n +2 | wc -l)
        echo "Insgesamt: **$SKILL_COUNT Skills**" >> SKILLS_OVERVIEW.md
        echo "" >> SKILLS_OVERVIEW.md
        
        # Liste alle Skills auf
        echo "### Skills Liste" >> SKILLS_OVERVIEW.md
        echo "" >> SKILLS_OVERVIEW.md
        
        find skills -maxdepth 1 -type d | tail -n +2 | sort | while read skill_dir; do
          skill_name=$(basename "$skill_dir")
          
          # Überprüfe ob SKILL.md existiert
          if [ -f "$skill_dir/SKILL.md" ]; then
            echo "- **$skill_name** ✅" >> SKILLS_OVERVIEW.md
          else
            echo "- **$skill_name** ⚠️" >> SKILLS_OVERVIEW.md
          fi
        done
        
        echo "" >> SKILLS_OVERVIEW.md
        echo "---" >> SKILLS_OVERVIEW.md
        echo "Letztes Update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> SKILLS_OVERVIEW.md
        
        echo "✅ Skills Dokumentation generiert!"
    
    - name: Generate Project Stats
      run: |
        echo "📊 Generiere Projekt Statistiken..."
        
        cat > PROJECT_STATS.md << 'EOF'
        # Projekt Statistiken
        
        Automatisch generiert: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
        
        ## Code Statistiken
        
        EOF
        
        # Zähle Zeilen Code
        TS_LINES=$(find server client -name "*.ts" -o -name "*.tsx" 2>/dev/null | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}')
        echo "- TypeScript/TSX Zeilen: **$TS_LINES**" >> PROJECT_STATS.md
        
        # Zähle Dateien
        TS_FILES=$(find server client -name "*.ts" -o -name "*.tsx" 2>/dev/null | wc -l)
        echo "- TypeScript/TSX Dateien: **$TS_FILES**" >> PROJECT_STATS.md
        
        # Skills
        SKILL_COUNT=$(find skills -maxdepth 1 -type d | tail -n +2 | wc -l)
        echo "- Skills: **$SKILL_COUNT**" >> PROJECT_STATS.md
        
        # Git Commits
        COMMIT_COUNT=$(git rev-list --count HEAD)
        echo "- Git Commits: **$COMMIT_COUNT**" >> PROJECT_STATS.md
        
        echo "" >> PROJECT_STATS.md
        echo "---" >> PROJECT_STATS.md
        echo "Letztes Update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> PROJECT_STATS.md
        
        echo "✅ Projekt Statistiken generiert!"
    
    - name: Commit and push documentation
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Überprüfe ob Änderungen vorhanden sind
        if git diff --quiet; then
          echo "ℹ️  Keine Dokumentations-Änderungen"
        else
          git add SKILLS_OVERVIEW.md PROJECT_STATS.md
          git commit -m "docs: Automatische Dokumentation aktualisiert [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          git push
          echo "✅ Dokumentation gepusht"
        fi
